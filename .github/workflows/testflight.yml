name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --filter=blob:none "$HOME/flutter"
          cd "$HOME/flutter"
          git checkout ff37bef603469fb030f2b72995ab929ccfc227f0
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Install Codemagic CLI tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-venv"
          source "$RUNNER_TEMP/codemagic-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-venv/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/codemagic-venv/bin:$PATH"
          command -v app-store-connect
          command -v keychain
          command -v xcode-project

      - name: Restore App Store Connect key
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Restore signing certificate key
        shell: bash
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$RUNNER_TEMP/cert_key"
          chmod 600 "$RUNNER_TEMP/cert_key"

      - name: Install dependencies
        shell: bash
        run: |
          flutter pub get
          flutter precache --ios
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          (cd ios && pod install)

      - name: Initialize signing keychain
        shell: bash
        run: keychain initialize

      - name: Fetch signing files
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "com.kantek.nailtalk"             --platform IOS             --type IOS_APP_STORE             --certificate-key "@file:$RUNNER_TEMP/cert_key"             --create

      - name: Apply provisioning profiles
        shell: bash
        run: |
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        shell: bash
        run: |
          flutter build ipa             --release             --build-name=1.0.0             --build-number="${GITHUB_RUN_NUMBER}"             --export-options-plist="$HOME/export_options.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nail-talk-ipa
          path: build/ios/ipa/*.ipa

      - name: Publish to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect publish             --path "$(find "$PWD/build/ios/ipa" -name '*.ipa' | head -n 1)"

      - name: Restore login keychain
        if: always()
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/codemagic-venv/bin:$PATH"
          if command -v keychain >/dev/null 2>&1; then
            keychain use-login
          fi
